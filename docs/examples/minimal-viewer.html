<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimal map viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9ec9e8; font: 13px/1.4 system-ui, sans-serif; }
  #info { position: fixed; left: 10px; top: 10px; padding: 8px 12px; border-radius: 6px;
          background: rgba(15, 18, 24, .78); color: #e6eaf0; white-space: pre; pointer-events: none; }
  #help { position: fixed; left: 10px; bottom: 10px; color: #1c2733; }
</style>
</head>
<body>
<div id="info">loading...</div>
<div id="help">Drag: look &middot; WASD: move &middot; Q/E: down/up &middot; Shift: fast &middot; wheel: speed</div>
<script type="module" src="./minimal-viewer.js"></script>
</body>
</html>
